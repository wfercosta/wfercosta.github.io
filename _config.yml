# Site settings
name: "wfercosta.com"
description: "A blog about Software Engineering, Software Architecture and Data. Content ranges from tools, programming languages, frameworks to methodologies."
favicon: "assets/images/favicon.ico"
baseurl: ""
url: "https://wfercosta.com"
production_url: https://wfercosta.com/

# Author
author:
  name: "Wander Costa"
  image: "authorimage.jpg"

# Social links
github: "wfercosta"
linkedin: "wfercosta"
devto: "wfercosta"

# Navigation
navigation:
  - text: Archive
    url: /tags
  - text: About
    url: /about

# Plugins
plugins_dir:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-polyglot

# i18n (jekyll-polyglot) — requires building via GitHub Actions (not GH Pages native)
languages: ["en", "pt-br"]
default_lang: "en"
exclude_from_localization: ["assets", "css", "js", "images", "fonts", "feed.xml", "sitemap.xml", "robots.txt", "CNAME"]
parallel_localization: true

# Pagination
paginate: 5
paginate_path: /page:num/

# Permalinks
permalink: /:title

# Other
markdown: kramdown

# Sass
sass:
  sass_dir: _sass
  style: compressed
