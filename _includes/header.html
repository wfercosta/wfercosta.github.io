<header class="nav">
  <div class="container">
    <div class="nav-inner">
      <a href="{{ site.baseurl }}/" class="brand">
        <div class="brand-mark">wf</div>
        <span class="brand-name">Engineering <em>Notes</em></span>
      </a>

      <nav class="nav-links">
        {% for item in site.navigation %}
          <a href="{{ site.baseurl }}{{ item.url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.text }}</a>
        {% endfor %}
      </nav>

      <div class="nav-actions">
        {% include theme-toggle.html %}
        <a href="{{ site.baseurl }}/feed.xml" class="btn-ghost" title="RSS Feed">RSS ↗</a>
      </div>
    </div>
  </div>
</header>
