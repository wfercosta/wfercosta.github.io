<header class="nav">
  <div class="container">
    <div class="nav-inner">
      <a href="{{ site.baseurl }}/" class="brand">
        <div class="brand-mark">wf</div>
        <span class="brand-name">Engineering <em>Notes</em></span>
      </a>

      {% assign lang = site.active_lang | default: site.default_lang %}
      {% assign t = site.data.i18n[lang] %}
      <nav class="nav-links">
        <a href="{{ site.baseurl }}/tags"{% if page.url contains '/tags' %} class="active"{% endif %}>{{ t.nav.archive }}</a>
        <a href="{{ site.baseurl }}/about"{% if page.url contains '/about' %} class="active"{% endif %}>{{ t.nav.about }}</a>
      </nav>

      <div class="nav-actions">
        {% include lang-toggle.html %}
        {% include theme-toggle.html %}
        <a href="{{ site.baseurl }}/feed.xml" class="btn-ghost" title="{{ t.footer.rss }}">{{ t.nav.rss }} ↗</a>
      </div>
    </div>
  </div>
</header>
