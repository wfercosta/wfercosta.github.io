<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>AI adoption maturity curve: from Builder to hybrid and agentic teams</title>
<desc>The Builder is a prototyping and validation stage, outside the maturity curve. The handoff delivers the prototype to engineering. The maturity curve has two levels: hybrid teams (spec-driven building) and agentic teams (repertoire turned into guardrails and harness).</desc>
<style>
  :root{
    --bg-gray:#F1EFE8; --st-gray:#5F5E5A; --tt-gray:#2C2C2A; --sub-gray:#5F5E5A;
    --bg-teal:#E1F5EE; --st-teal:#0F6E56; --tt-teal:#04342C; --sub-teal:#0F6E56;
    --bg-purple:#EEEDFE; --st-purple:#534AB7; --tt-purple:#26215C; --sub-purple:#534AB7;
    --line:#888780; --dash:#B4B2A9; --label:#5F5E5A; --frame-title:#2C2C2A;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-gray:#2C2C2A; --st-gray:#B4B2A9; --tt-gray:#F1EFE8; --sub-gray:#D3D1C7;
      --bg-teal:#085041; --st-teal:#5DCAA5; --tt-teal:#9FE1CB; --sub-teal:#9FE1CB;
      --bg-purple:#3C3489; --st-purple:#AFA9EC; --tt-purple:#CECBF6; --sub-purple:#CECBF6;
      --line:#9C9A92; --dash:#5F5E5A; --label:#B4B2A9; --frame-title:#E6E4DB;
    }
  }
  .lbl{font-size:12px;fill:var(--label);}
  .frame-t{font-size:14px;font-weight:500;fill:var(--frame-title);}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="120" y="34" text-anchor="middle" class="lbl">Conception stage</text>
<rect x="40" y="48" width="160" height="64" rx="8" fill="var(--bg-gray)" stroke="var(--st-gray)" stroke-width="0.5"/>
<text x="120" y="74" text-anchor="middle" font-size="14" font-weight="500" fill="var(--tt-gray)">Builder</text>
<text x="120" y="94" text-anchor="middle" font-size="12" fill="var(--sub-gray)">Prototype and validation</text>

<text x="250" y="76" text-anchor="middle" class="lbl">handoff</text>
<line x1="204" y1="80" x2="296" y2="80" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="300" y="40" width="350" height="232" rx="16" fill="none" stroke="var(--dash)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="475" y="62" text-anchor="middle" class="frame-t">Maturity curve</text>

<rect x="322" y="84" width="306" height="76" rx="8" fill="var(--bg-teal)" stroke="var(--st-teal)" stroke-width="0.5"/>
<text x="342" y="108" font-size="12" fill="var(--sub-teal)">1st level</text>
<text x="342" y="128" font-size="14" font-weight="500" fill="var(--tt-teal)">Hybrid teams</text>
<text x="342" y="148" font-size="12" fill="var(--sub-teal)">Spec- and standards-driven building</text>

<line x1="475" y1="160" x2="475" y2="184" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="322" y="184" width="306" height="76" rx="8" fill="var(--bg-purple)" stroke="var(--st-purple)" stroke-width="0.5"/>
<text x="342" y="208" font-size="12" fill="var(--sub-purple)">2nd level</text>
<text x="342" y="228" font-size="14" font-weight="500" fill="var(--tt-purple)">Agentic teams</text>
<text x="342" y="248" font-size="12" fill="var(--sub-purple)">Repertoire turns into guardrails and harness</text>
</svg>
